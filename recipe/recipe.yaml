context:
  version: "10.5.1"

package:
  name: fd-find
  version: ${{ version }}

source:
  url: https://github.com/sharkdp/fd/archive/v${{ version }}.tar.gz
  sha256: 3ea70c258d3390a601b436b6f4c545e3a944ff3de44c8ee5542c05588e337032

build:
  number: 0
  script: build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - if: unix
      then: make

tests:
  - package_contents:
      bin:
        - fd
  - script:
      - fd --help

about:
  homepage: https://github.com/sharkdp/fd
  repository: https://github.com/sharkdp/fd
  license: MIT
  license_family: MIT
  summary: A simple, fast and user-friendly alternative to 'find'
  license_file:
    - LICENSE-MIT
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - hmaarrfk
    - dbast
